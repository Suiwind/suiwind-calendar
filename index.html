<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>素问 · 五行日历 & 八字合盘 V5.2</title>
<style>
  :root {
    --bg: #F6F1E7;
    --card: #FCF9F2;
    --ink: #24201E;
    --muted: #766E66;
    --border: #E2D9C8;
    --accent: #A63429;     /* 朱砂红 */
    --accent-soft: #F3E1DD;
    --jade: #366859;       /* 黛绿 */
    --gold: #B68D40;       /* 泥金 */
    --wood: #3A7D5C;
    --fire: #C2493A;
    --earth: #A67C46;
    --metal: #7D848C;
    --water: #356789;
    --radius: 14px;
    --shadow: 0 6px 24px rgba(45, 34, 24, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  .serif { font-family: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif; }
  header {
    background: linear-gradient(180deg, #EFE7D8 0%, var(--bg) 100%);
    padding: 20px 16px 12px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--ink);
    font-weight: 700;
  }
  header p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .tabs {
    display: flex;
    max-width: 780px;
    margin: 14px auto 0;
    padding: 4px;
    background: #EAE2D3;
    border-radius: 12px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    border-radius: 9px;
    cursor: pointer;
    transition: all .2s;
  }
  .tab-btn.active {
    background: var(--card);
    color: var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .container {
    max-width: 780px;
    margin: 16px auto;
    padding: 0 14px;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  /* 表单与按钮 */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
  .form-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .form-row label { font-size: 12px; color: var(--muted); font-weight: 600; }
  input, select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #FFFDF9;
    color: var(--ink);
    font-size: 14px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .inline-row { display: flex; gap: 8px; align-items: center; }
  .checkbox-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .checkbox-label input { width: auto; }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn:hover { opacity: 0.92; }
  .btn-sub {
    background: #EAE2D3;
    color: var(--ink);
    width: auto;
    padding: 7px 12px;
    font-size: 12px;
  }

  /* 五行配色 */
  .el-木 { color: var(--wood); } .bg-木 { background: var(--wood); }
  .el-火 { color: var(--fire); } .bg-火 { background: var(--fire); }
  .el-土 { color: var(--earth); } .bg-土 { background: var(--earth); }
  .el-金 { color: var(--metal); } .bg-金 { background: var(--metal); }
  .el-水 { color: var(--water); } .bg-水 { background: var(--water); }

  /* 日历样式 */
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .cal-nav { display: flex; gap: 6px; align-items: center; }
  .cal-month-label { font-size: 17px; font-weight: 700; min-width: 120px; text-align: center; }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cal-cell {
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 6px 2px;
    text-align: center;
    cursor: pointer;
    background: #FFFDF8;
    transition: all .15s;
    position: relative;
  }
  .cal-cell:hover { border-color: var(--gold); }
  .cal-cell.other-month { opacity: 0.35; }
  .cal-cell.today { border-color: var(--jade); background: #EFF6F3; }
  .cal-cell.selected { border-color: var(--accent); background: var(--accent-soft); }
  .cal-day-num { font-size: 14px; font-weight: 700; }
  .cal-gz { font-size: 11px; margin-top: 1px; }
  .cal-dot {
    width: 6px; height: 6px; border-radius: 50%;
    margin: 3px auto 0;
  }
  .cal-tag {
    font-size: 9px;
    color: var(--accent);
    font-weight: 600;
    line-height: 1.1;
  }

  /* 四柱展示 */
  .pillars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 10px 0;
  }
  .pillar-box {
    background: #FFFDF8;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 4px;
    text-align: center;
  }
  .pillar-label { font-size: 11px; color: var(--muted); }
  .pillar-gz { font-size: 20px; font-weight: 700; margin: 4px 0; letter-spacing: 2px; }
  .pillar-sub { font-size: 11px; color: var(--muted); }

  /* 五行进度条 */
  .wx-bars { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
  .wx-bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .wx-bar-track {
    flex: 1; height: 8px; background: #ECE5D7; border-radius: 99px; overflow: hidden;
  }
  .wx-bar-fill { height: 100%; border-radius: 99px; transition: width .4s; }

  /* 合盘结果 */
  .score-hero {
    text-align: center;
    padding: 16px 10px;
    background: linear-gradient(135deg, #FAF4E8 0%, #F4E8DC 100%);
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .score-num { font-size: 42px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .score-range { font-size: 13px; color: var(--jade); font-weight: 600; margin-top: 4px; }
  .score-verdict { font-size: 14px; color: var(--ink); margin-top: 6px; }
  .radar-wrap { display: flex; justify-content: center; margin: 10px 0; }
  .dim-item {
    border-top: 1px dashed var(--border);
    padding: 10px 0;
  }
  .dim-head { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
  .dim-desc { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* 历史记录 */
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    background: #FFFDF8;
    cursor: pointer;
  }
  .history-item:hover { border-color: var(--gold); }
  .history-meta { font-size: 12px; color: var(--muted); }
  .del-btn {
    border: none; background: transparent; color: var(--muted);
    font-size: 12px; cursor: pointer; padding: 4px 8px;
  }
  .del-btn:hover { color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1 class="serif">素问 · 五行日历与八字合盘</h1>
  <p>V5.2 · Jean Meeus 节气算法 · 真太阳时校正 · 本地离线存储</p>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('calendar')">五行日历</button>
    <button class="tab-btn" onclick="switchTab('synastry')">八字合盘 V5.2</button>
  </div>
</header>

<div class="container">
  <!-- ==================== TAB 1: 五行日历 ==================== -->
  <section id="tab-calendar" class="panel active">
    <div class="card">
      <div class="card-title">
        <span>个人命局偏好（用于日历五行生克打分）</span>
        <span class="badge">自动保存</span>
      </div>
      <div class="grid-2">
        <div class="form-row">
          <label>我的日主（天干）</label>
          <select id="myDayMaster" onchange="saveProfileAndRenderCal()">
            <option value="0">甲木（阳木）</option><option value="1">乙木（阴木）</option>
            <option value="2">丙火（阳火）</option><option value="3">丁火（阴火）</option>
            <option value="4">戊土（阳土）</option><option value="5">己土（阴土）</option>
            <option value="6">庚金（阳金）</option><option value="7">辛金（阴金）</option>
            <option value="8">壬水（阳水）</option><option value="9">癸水（阴水）</option>
          </select>
        </div>
        <div class="form-row">
          <label>我的喜用五行（主喜用组合）</label>
          <select id="myFavorable" onchange="saveProfileAndRenderCal()">
            <option value="木,火">喜木火（调候/通明）</option>
            <option value="火,土">喜火土</option>
            <option value="土,金">喜土金</option>
            <option value="金,水">喜金水</option>
            <option value="水,木">喜水木</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="cal-header">
        <div class="cal-nav">
          <button class="btn btn-sub" onclick="changeMonth(-1)">‹ 上月</button>
          <div id="calMonthLabel" class="cal-month-label serif"></div>
          <button class="btn btn-sub" onclick="changeMonth(1)">下月 ›</button>
        </div>
        <button class="btn btn-sub" onclick="goToday()">回到今日</button>
      </div>
      <div class="cal-weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div id="calGrid" class="cal-grid"></div>
      <p class="hint">注：圆点颜色代表当日日干五行（绿木 / 红火 / 褐土 / 灰金 / 蓝水）；标“喜”为契合个人喜用神之日。</p>
    </div>

    <div id="calDetailCard" class="card"></div>
  </section>

  <!-- ==================== TAB 2: 八字合盘 ==================== -->
  <section id="tab-synastry" class="panel">
    <div class="grid-2">
      <!-- 甲方 -->
      <div class="card">
        <div class="card-title"><span>甲方信息</span><span class="badge">Person A</span></div>
        <div class="form-row">
          <label>称呼</label>
          <input id="nameA" type="text" value="甲方" placeholder="输入称呼">
        </div>
        <div class="form-row">
          <label>公历出生日期</label>
          <input id="dateA" type="date" value="2006-11-18">
        </div>
        <div class="form-row">
          <label>出生时间（北京时间）</label>
          <div class="inline-row">
            <input id="timeA" type="time" value="12:00">
            <label class="checkbox-label"><input id="unkA" type="checkbox" onchange="toggleTime('A')">未知时辰</label>
          </div>
        </div>
        <div class="form-row">
          <label>出生地经度（东经，默认南京 118.78°）</label>
          <input id="lonA" type="number" step="0.01" value="118.78">
        </div>
      </div>

      <!-- 乙方 -->
      <div class="card">
        <div class="card-title"><span>乙方信息</span><span class="badge">Person B</span></div>
        <div class="form-row">
          <label>称呼</label>
          <input id="nameB" type="text" value="乙方" placeholder="输入称呼">
        </div>
        <div class="form-row">
          <label>公历出生日期</label>
          <input id="dateB" type="date" value="2006-05-20">
        </div>
        <div class="form-row">
          <label>出生时间（北京时间）</label>
          <div class="inline-row">
            <input id="timeB" type="time" value="14:30">
            <label class="checkbox-label"><input id="unkB" type="checkbox" onchange="toggleTime('B')">未知时辰</label>
          </div>
        </div>
        <div class="form-row">
          <label>出生地经度（东经，默认北京 116.40°）</label>
          <input id="lonB" type="number" step="0.01" value="116.40">
        </div>
      </div>
    </div>

    <div class="card" style="padding: 12px;">
      <button class="btn" onclick="runSynastry()">开始真太阳时排盘与五维合盘</button>
    </div>

    <div id="synastryResult"></div>

    <div class="card">
      <div class="card-title">
        <span>本地合盘记录</span>
        <button class="btn btn-sub" onclick="clearHistory()">清空</button>
      </div>
      <div id="historyList"></div>
    </div>
  </section>
</div>

<script>
/* ================= 基础历法与五行常量 ================= */
const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const STEM_EL = ['木','木','火','火','土','土','金','金','水','水'];
const BRANCH_EL = ['水','土','木','木','土','火','火','土','金','金','土','水'];
const ELEMENTS = ['木','火','土','金','水'];

// 地支藏干（主气、中气、余气权重）
const HIDDEN_STEMS = [
  [[9,1.0]],                     // 子: 癸
  [[5,0.6],[9,0.25],[7,0.15]],   // 丑: 己癸辛
  [[0,0.6],[2,0.25],[4,0.15]],   // 寅: 甲丙戊
  [[1,1.0]],                     // 卯: 乙
  [[4,0.6],[1,0.25],[9,0.15]],   // 辰: 戊乙癸
  [[2,0.6],[6,0.25],[4,0.15]],   // 巳: 丙庚戊
  [[3,0.7],[5,0.3]],             // 午: 丁己
  [[5,0.6],[3,0.25],[1,0.15]],   // 未: 己丁乙
  [[6,0.6],[8,0.25],[4,0.15]],   // 申: 庚壬戊
  [[7,1.0]],                     // 酉: 辛
  [[4,0.6],[7,0.25],[3,0.15]],   // 戌: 戊辛丁
  [[8,0.7],[0,0.3]]              // 亥: 壬甲
];

const SOLAR_TERMS = [
  '春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露',
  '秋分','寒露','霜降','立冬','小雪','大雪','冬至','小寒','大寒','立春','雨水','惊蛰'
];

/* ================= Jean Meeus 太阳黄经 & 真太阳时 ================= */
function toJulianDay(year, month, day, hourUTC) {
  let y = year, m = month;
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + hourUTC / 24 + B - 1524.5;
}

function getSunLongitude(jd) {
  const T = (jd - 2451545.0) / 36525.0;
  let L0 = (280.46646 + 36000.76983 * T + 0.0003032 * T * T) % 360;
  if (L0 < 0) L0 += 360;
  let M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) % 360;
  if (M < 0) M += 360;
  const Mrad = M * Math.PI / 180;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad)
          + 0.000289 * Math.sin(3 * Mrad);
  const trueLon = L0 + C;
  const omega = (125.04 - 1934.136 * T) * Math.PI / 180;
  let lambda = (trueLon - 0.00569 - 0.00478 * Math.sin(omega)) % 360;
  if (lambda < 0) lambda += 360;
  return lambda;
}

function getTrueSolarOffsetMin(year, month, day, lon) {
  const start = Date.UTC(year, 0, 0);
  const cur = Date.UTC(year, month - 1, day);
  const dayOfYear = Math.floor((cur - start) / 86400000);
  const B = 2 * Math.PI * (dayOfYear - 81) / 365;
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  return (lon - 120) * 4 + eot;
}

function calcBazi(year, month, day, hour, minute, lon = 120, fixedHourBranch = null) {
  const offsetMin = getTrueSolarOffsetMin(year, month, day, lon);
  const baseMs = Date.UTC(year, month - 1, day, hour, minute);
  const tstMs = baseMs + Math.round(offsetMin * 60000);
  const tst = new Date(tstMs);

  const ty = tst.getUTCFullYear();
  const tm = tst.getUTCMonth() + 1;
  const td = tst.getUTCDate();
  const th = tst.getUTCHours();
  const tmin = tst.getUTCMinutes();

  const utcHour = (hour + minute / 60) - 8;
  const jd = toJulianDay(year, month, day, utcHour);
  const sunLon = getSunLongitude(jd);

  // 1. 年柱（立春 315° 换年）
  let baziYear = year;
  if (month <= 2 && sunLon < 315 && sunLon > 260) baziYear = year - 1;
  if (month === 12 && sunLon >= 315) baziYear = year + 1;
  const yStem = ((baziYear - 4) % 10 + 10) % 10;
  const yBranch = ((baziYear - 4) % 12 + 12) % 12;

  // 2. 月柱（12节气换月，立春315°起寅月）
  const shifted = (sunLon - 315 + 360) % 360;
  const monthIdx = Math.floor(shifted / 30);
  const mBranch = (monthIdx + 2) % 12;
  const mStem = ((yStem % 5) * 2 + 2 + monthIdx) % 10;

  // 3. 日柱（2000-01-01 为 戊午=54；23:00晚子时换日柱）
  let dayShift = (fixedHourBranch === null && th >= 23) ? 1 : 0;
  const daysSince2000 = Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(2000, 0, 1)) / 86400000) + dayShift;
  const dIdx = ((54 + daysSince2000) % 60 + 60) % 60;
  const dStem = dIdx % 10;
  const dBranch = dIdx % 12;

  // 4. 时柱（五鼠遁）
  const hBranch = fixedHourBranch !== null ? fixedHourBranch : Math.floor(((th + 1) % 24) / 2);
  const hStem = ((dStem % 5) * 2 + hBranch) % 10;

  // 五行力量统计（月令加权 1.8，日支加权 1.2）
  const scores = { '木':0, '火':0, '土':0, '金':0, '水':0 };
  const sArr = [yStem, mStem, dStem, hStem];
  const bArr = [yBranch, mBranch, dBranch, hBranch];
  const bWeights = [1.0, 1.8, 1.2, 1.0];
  sArr.forEach(s => { scores[STEM_EL[s]] += 1.0; });
  bArr.forEach((b, idx) => {
    HIDDEN_STEMS[b].forEach(([hs, w]) => {
      scores[STEM_EL[hs]] += w * bWeights[idx];
    });
  });
  const total = Object.values(scores).reduce((a, b) => a + b, 0);
  const pct = {};
  ELEMENTS.forEach(e => pct[e] = +(scores[e] / total * 100).toFixed(1));

  const termIdx = Math.floor(sunLon / 15) % 24;

  return {
    pillars: [
      { label:'年柱', s:yStem, b:yBranch },
      { label:'月柱', s:mStem, b:mBranch },
      { label:'日柱', s:dStem, b:dBranch },
      { label:'时柱', s:hStem, b:hBranch }
    ],
    yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch,
    pct, sunLon, termName: SOLAR_TERMS[termIdx],
    tstStr: `${String(th).padStart(2,'0')}:${String(tmin).padStart(2,'0')}`,
    offsetMin: Math.round(offsetMin)
  };
}

function getTenGod(meStem, targetStem) {
  const meEl = Math.floor(meStem / 2);
  const tEl = Math.floor(targetStem / 2);
  const samePol = (meStem % 2) === (targetStem % 2);
  const diff = (tEl - meEl + 5) % 5;
  const map = [
    ['比肩','劫财'],
    ['食神','伤官'],
    ['偏财','正财'],
    ['七杀','正官'],
    ['偏印','正印']
  ];
  return map[diff][samePol ? 0 : 1];
}

/* ================= 五行日历逻辑 ================= */
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth() + 1;
let selectedDateStr = formatDate(new Date());

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadProfile() {
  const saved = JSON.parse(localStorage.getItem('suwen_profile') || '{}');
  if (saved.dayMaster !== undefined) document.getElementById('myDayMaster').value = saved.dayMaster;
  if (saved.favorable) document.getElementById('myFavorable').value = saved.favorable;
}

function saveProfileAndRenderCal() {
  localStorage.setItem('suwen_profile', JSON.stringify({
    dayMaster: document.getElementById('myDayMaster').value,
    favorable: document.getElementById('myFavorable').value
  }));
  renderCalendar();
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  if (calMonth < 1) { calMonth = 12; calYear--; }
  renderCalendar();
}

function goToday() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth() + 1;
  selectedDateStr = formatDate(now);
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('calMonthLabel').textContent = `${calYear}年 ${calMonth}月`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(calYear, calMonth - 1, 1);
  const startWeek = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const prevMonthDays = new Date(calYear, calMonth - 1, 0).getDate();
  const todayStr = formatDate(new Date());
  const favs = document.getElementById('myFavorable').value.split(',');

  const totalCells = Math.ceil((startWeek + daysInMonth) / 7) * 7;
  for (let i = 0; i < totalCells; i++) {
    let y = calYear, m = calMonth, d, isOther = false;
    if (i < startWeek) {
      d = prevMonthDays - startWeek + i + 1;
      m -= 1; if (m < 1) { m = 12; y -= 1; }
      isOther = true;
    } else if (i >= startWeek + daysInMonth) {
      d = i - startWeek - daysInMonth + 1;
      m += 1; if (m > 12) { m = 1; y += 1; }
      isOther = true;
    } else {
      d = i - startWeek + 1;
    }
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const bz = calcBazi(y, m, d, 12, 0, 120);
    const el = STEM_EL[bz.dStem];
    const isFav = favs.includes(el) || favs.includes(BRANCH_EL[bz.dBranch]);

    const cell = document.createElement('div');
    cell.className = 'cal-cell'
      + (isOther ? ' other-month' : '')
      + (ds === todayStr ? ' today' : '')
      + (ds === selectedDateStr ? ' selected' : '');
    cell.innerHTML = `
      <div class="cal-day-num">${d}</div>
      <div class="cal-gz el-${el}">${STEMS[bz.dStem]}${BRANCHES[bz.dBranch]}</div>
      <div class="cal-dot bg-${el}"></div>
      ${isFav ? '<div class="cal-tag">喜</div>' : '<div class="cal-tag">&nbsp;</div>'}
    `;
    cell.onclick = () => {
      selectedDateStr = ds;
      if (isOther) { calYear = y; calMonth = m; }
      renderCalendar();
    };
    grid.appendChild(cell);
  }
  renderCalDetail();
}

/* ================= 八字合盘五维评分引擎 ================= */
const STEM_COMBINE = [[0,5],[1,6],[2,7],[3,8],[4,9]];
const BRANCH_SIX_COMBINE = [[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
const BRANCH_CLASH = [[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];
const BRANCH_HARM = [[0,7],[1,6],[2,5],[3,4],[8,11],[9,10]];
const BRANCH_TRINE = [[8,0,4],[11,3,7],[2,6,10],[5,9,1]];

function hasPair(list, a, b) {
  return list.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
}
function sameTrine(a, b) {
  return a !== b && BRANCH_TRINE.some(g => g.includes(a) && g.includes(b));
}
function elRelation(e1, e2) {
  const i1 = ELEMENTS.indexOf(e1), i2 = ELEMENTS.indexOf(e2);
  if (i1 === i2) return '比和';
  if ((i1 + 1) % 5 === i2 || (i2 + 1) % 5 === i1) return '相生';
  return '相克';
}

function evaluatePair(bzA, bzB) {
  let s1 = 72, d1 = '';
  const elA = STEM_EL[bzA.dStem], elB = STEM_EL[bzB.dStem];
  if (hasPair(STEM_COMBINE, bzA.dStem, bzB.dStem)) {
    s1 = 94; d1 = `${STEMS[bzA.dStem]}${STEMS[bzB.dStem]}天干五合，天生具备强吸引力与默契底色。`;
  } else {
    const rel = elRelation(elA, elB);
    if (rel === '相生') { s1 = 84; d1 = `日主${elA}与${elB}相生，相处自然顺畅，一方易给予另一方滋养。`; }
    else if (rel === '比和') { s1 = 78; d1 = `日主同属${elA}，三观底色相近，像朋友一样自在，需注意固执碰撞。`; }
    else { s1 = 62; d1 = `日主${elA}与${elB}相克，初期张力强，长久相处需要留出边界与磨合空间。`; }
  }

  let s2 = 74, d2 = '';
  const bA = bzA.dBranch, bB = bzB.dBranch;
  if (hasPair(BRANCH_SIX_COMBINE, bA, bB)) {
    s2 = 95; d2 = `夫妻宫${BRANCHES[bA]}${BRANCHES[bB]}六合，生活习惯与亲密感高度粘合。`;
  } else if (sameTrine(bA, bB)) {
    s2 = 88; d2 = `夫妻宫${BRANCHES[bA]}${BRANCHES[bB]}半三合，步调一致，遇事容易拧成一股绳。`;
  } else if (hasPair(BRANCH_CLASH, bA, bB)) {
    s2 = 48; d2 = `夫妻宫${BRANCHES[bA]}${BRANCHES[bB]}六冲，生活节奏或情绪表达差异明显，忌冷战硬碰。`;
  } else if (hasPair(BRANCH_HARM, bA, bB)) {
    s2 = 56; d2 = `夫妻宫${BRANCHES[bA]}${BRANCHES[bB]}相害，易在细节琐事上产生误解，沟通宜直接摊开。`;
  } else if (bA === bB) {
    s2 = 76; d2 = `夫妻宫同为${BRANCHES[bA]}，生活习惯高度一致，默契好但略缺新鲜互补。`;
  } else {
    d2 = `夫妻宫${BRANCHES[bA]}与${BRANCHES[bB]}无明显合冲，关系平稳，取决于后天经营。`;
  }

  let compBonus = 0, compDetails = [];
  ELEMENTS.forEach(e => {
    const a = bzA.pct[e], b = bzB.pct[e];
    if ((a < 14 && b > 22) || (b < 14 && a > 22)) {
      compBonus += 12;
      compDetails.push(e);
    } else if (Math.abs(a - b) > 15) {
      compBonus += 5;
    }
  });
  let s3 = Math.min(96, Math.round(62 + compBonus));
  let d3 = compDetails.length
    ? `双方在【${compDetails.join('、')}】五行上形成明显互补，能平衡彼此的能量短板。`
    : '双方五行分布结构较为接近，共鸣度高，但能量互补性相对平和。';

  let s4 = 75, d4 = '';
  const mA = bzA.mBranch, mB = bzB.mBranch;
  if (hasPair(BRANCH_SIX_COMBINE, mA, mB) || sameTrine(mA, mB)) {
    s4 = 89; d4 = `月令${BRANCHES[mA]}与${BRANCHES[mB]}相合，处事气场与现实节奏合拍。`;
  } else if (hasPair(BRANCH_CLASH, mA, mB)) {
    const coldWarm = ([11,0,1].includes(mA) && [5,6,7].includes(mB)) || ([11,0,1].includes(mB) && [5,6,7].includes(mA));
    if (coldWarm) {
      s4 = 78; d4 = `月令冬夏对冲，性格一冷一热，磨合好反而形成极佳的寒暖调候。`;
    } else {
      s4 = 58; d4 = `月令${BRANCHES[mA]}${BRANCHES[mB]}相冲，面对外部压力时的应激方式不同。`;
    }
  } else {
    d4 = `月令气场平和（${BRANCHES[mA]}月与${BRANCHES[mB]}月），相处节奏舒适自然。`;
  }

  let s5 = 74, d5 = '';
  if (hasPair(BRANCH_SIX_COMBINE, bzA.yBranch, bzB.yBranch) || sameTrine(bzA.yBranch, bzB.yBranch)) {
    s5 = 88; d5 = `年支${BRANCHES[bzA.yBranch]}${BRANCHES[bzB.yBranch]}相合，原生背景与底层价值观契合度高。`;
  } else if (hasPair(BRANCH_CLASH, bzA.yBranch, bzB.yBranch)) {
    s5 = 56; d5 = `年支${BRANCHES[bzA.yBranch]}${BRANCHES[bzB.yBranch]}相冲，家庭观念或成长环境差异较大。`;
  } else {
    d5 = `年柱根基平稳，无明显代际或背景冲突。`;
  }

  const total = Math.round(s1 * 0.25 + s2 * 0.25 + s3 * 0.22 + s4 * 0.16 + s5 * 0.12);
  return {
    total,
    dims: [
      { name:'日主契合', score:s1, desc:d1 },
      { name:'夫妻宫', score:s2, desc:d2 },
      { name:'五行互补', score:s3, desc:d3 },
      { name:'月令气场', score:s4, desc:d4 },
      { name:'年柱根基', score:s5, desc:d5 }
    ]
  };
}

function buildRadarSVG(dims, minDims = null, maxDims = null) {
  const cx = 140, cy = 135, r = 92;
  const angles = dims.map((_, i) => -Math.PI / 2 + i * 2 * Math.PI / 5);
  const pt = (val, i) => {
    const rad = r * (val / 100);
    return `${(cx + rad * Math.cos(angles[i])).toFixed(1)},${(cy + rad * Math.sin(angles[i])).toFixed(1)}`;
  };

  let gridSvg = '';
  [25, 50, 75, 100].forEach(level => {
    const pts = angles.map((_, i) => pt(level, i)).join(' ');
    gridSvg += `<polygon points="${pts}" fill="none" stroke="#DDD3C0" stroke-width="1"/>`;
  });
  angles.forEach((_, i) => {
    const [x, y] = pt(100, i).split(',');
    gridSvg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#DDD3C0" stroke-width="1"/>`;
    const [lx, ly] = pt(118, i).split(',');
    gridSvg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#5C534B" font-weight="600">${dims[i].name}</text>`;
  });

  const mainPts = dims.map((d, i) => pt(d.score, i)).join(' ');
  let rangeSvg = '';
  if (minDims && maxDims) {
    const maxPts = maxDims.map((v, i) => pt(v, i)).join(' ');
    rangeSvg = `<polygon points="${maxPts}" fill="rgba(54,104,89,0.12)" stroke="#366859" stroke-dasharray="4 3" stroke-width="1.5"/>`;
  }

  return `
    <svg width="280" height="270" viewBox="0 0 280 270">
      ${gridSvg}
      ${rangeSvg}
      <polygon points="${mainPts}" fill="rgba(166,52,41,0.22)" stroke="#A63429" stroke-width="2"/>
      ${dims.map((d, i) => {
        const [x, y] = pt(d.score, i).split(',');
        return `<circle cx="${x}" cy="${y}" r="3.5" fill="#A63429"/>`;
      }).join('')}
    </svg>
  `;
}

function runSynastry(saveToHistory = true) {
  const nameA = document.getElementById('nameA').value.trim() || '甲方';
  const nameB = document.getElementById('nameB').value.trim() || '乙方';
  const dateA = document.getElementById('dateA').value;
  const dateB = document.getElementById('dateB').value;
  const timeA = document.getElementById('timeA').value || '12:00';
  const timeB = document.getElementById('timeB').value || '12:00';
  const unkA = document.getElementById('unkA').checked;
  const unkB = document.getElementById('unkB').checked;
  const lonA = parseFloat(document.getElementById('lonA').value) || 120;
  const lonB = parseFloat(document.getElementById('lonB').value) || 120;

  if (!dateA || !dateB) return alert('请完整填写双方出生日期');
  const [yA, mA, dA] = dateA.split('-').map(Number);
  const [hA, minA] = timeA.split(':').map(Number);
  const [yB, mB, dB] = dateB.split('-').map(Number);
  const [hB, minB] = timeB.split(':').map(Number);

  const baseA = calcBazi(yA, mA, dA, hA, minA, lonA);
  const baseB = calcBazi(yB, mB, dB, hB, minB, lonB);

  let evalRes, minScore, maxScore, maxDimArr = null, minDimArr = null;
  if (!unkA && !unkB) {
    evalRes = evaluatePair(baseA, baseB);
    minScore = maxScore = evalRes.total;
  } else {
    const hoursA = unkA ? [...Array(12).keys()] : [null];
    const hoursB = unkB ? [...Array(12).keys()] : [null];
    let sumTotal = 0, count = 0;
    minScore = 100; maxScore = 0;
    const dimSums = [0,0,0,0,0];
    maxDimArr = [0,0,0,0,0];
    minDimArr = [100,100,100,100,100];
    let sampleRes = null;

    hoursA.forEach(hbA => {
      const bzA = hbA === null ? baseA : calcBazi(yA, mA, dA, 12, 0, lonA, hbA);
      hoursB.forEach(hbB => {
        const bzB = hbB === null ? baseB : calcBazi(yB, mB, dB, 12, 0, lonB, hbB);
        const r = evaluatePair(bzA, bzB);
        if (!sampleRes) sampleRes = r;
        sumTotal += r.total; count++;
        if (r.total < minScore) minScore = r.total;
        if (r.total > maxScore) maxScore = r.total;
        r.dims.forEach((dm, idx) => {
          dimSums[idx] += dm.score;
          if (dm.score > maxDimArr[idx]) maxDimArr[idx] = dm.score;
          if (dm.score < minDimArr[idx]) minDimArr[idx] = dm.score;
        });
      });
    });

    evalRes = {
      total: Math.round(sumTotal / count),
      dims: sampleRes.dims.map((dm, idx) => ({
        name: dm.name,
        score: Math.round(dimSums[idx] / count),
        desc: dm.desc + (maxDimArr[idx] !== minDimArr[idx] ? `（时辰波动区间 ${minDimArr[idx]}–${maxDimArr[idx]} 分）` : '')
      }))
    };
  }

  const verdict = evalRes.total >= 85 ? '天作之合 · 气场深度共鸣'
    : evalRes.total >= 75 ? '良缘可期 · 互补大于摩擦'
    : evalRes.total >= 65 ? '平实相守 · 重在沟通磨合'
    : '张力较强 · 需留足边界感';

  document.getElementById('synastryResult').innerHTML = `
    <div class="card">
      <div class="score-hero">
        <div style="font-size:13px;color:var(--muted)">${nameA} × ${nameB} · 综合默契指数</div>
        <div class="score-num serif">${evalRes.total}</div>
        ${(unkA || unkB) ? `<div class="score-range">未知时辰穷举区间：${minScore} – ${maxScore} 分（虚线为上限）</div>` : ''}
        <div class="score-verdict">${verdict}</div>
      </div>

      ${renderPillarMini(nameA, baseA, unkA)}
      ${renderPillarMini(nameB, baseB, unkB)}

      <div class="radar-wrap">${buildRadarSVG(evalRes.dims, minDimArr, maxDimArr)}</div>

      ${evalRes.dims.map(d => `
        <div class="dim-item">
          <div class="dim-head">
            <span>${d.name}</span>
            <span style="color:var(--accent)">${d.score} 分</span>
          </div>
          <div class="dim-desc">${d.desc}</div>
        </div>
      `).join('')}
    </div>
  `;

  if (saveToHistory) {
    saveHistory({
      id: Date.now(),
      nameA, dateA, timeA, unkA, lonA,
      nameB, dateB, timeB, unkB, lonB,
      score: evalRes.total,
      range: (unkA || unkB) ? `${minScore}-${maxScore}` : null,
      createdAt: new Date().toLocaleString('zh-CN', { hour12:false })
    });
  }
}

  const el = document.getElementById('historyList');
  if (!list.length) {
    el.innerHTML = '<p class="hint">暂无合盘记录，点击上方按钮测算后将自动保存于本地浏览器。</p>';
    return;
  }
  el.innerHTML = list.map(item => `
    <div class="history-item" onclick="loadHistoryById(${item.id})">
      <div>
        <div style="font-size:14px;font-weight:700">${item.nameA} × ${item.nameB}
          <span class="badge" style="margin-left:6px">${item.score}分${item.range ? ` (${item.range})` : ''}</span>
        </div>
        <div class="history-meta">${item.dateA} / ${item.dateB} · ${item.createdAt}</div>
      </div>
      <button class="del-btn" onclick="deleteHistory(${item.id}, event)">删除</button>
    </div>
  `).join('');
}

/* ================= Tab 切换与初始化 ================= */
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && name === 'calendar') || (i === 1 && name === 'synastry'));
  });
  document.getElementById('tab-calendar').classList.toggle('active', name === 'calendar');
  document.getElementById('tab-synastry').classList.toggle('active', name === 'synastry');
}

loadProfile();
renderCalendar();
renderHistory();
</script>
</body>
</html>
