<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>八字合盘 V5.4 · 苏伊温德日历内置引擎</title>
<style>
  :root {
    --bg: #f2efe8;
    --card: #ffffff;
    --card-soft: #f4f2eb;
    --line: rgba(48, 60, 46, 0.10);
    --line-soft: rgba(48, 60, 46, 0.06);
    --text: #232b22;
    --text-2: #4c574a;
    --muted: #7b8477;
    --accent: #526e51;
    --accent-strong: #3f593e;
    --accent-soft: #e6eee4;
    --warm: #b5574b;
    --warm-soft: #f8ebe9;
    --wood: #3e7a56;
    --fire: #b8534a;
    --earth: #9f7a3d;
    --metal: #6e7780;
    --water: #486e8a;
    --radius: 14px;
    --shadow: 0 4px 16px rgba(36, 48, 34, 0.045);
  }
  [data-theme="dark"] {
    --bg: #131713;
    --card: #212822;
    --card-soft: #1b221c;
    --line: rgba(220, 232, 218, 0.10);
    --line-soft: rgba(220, 232, 218, 0.06);
    --text: #e6eae2;
    --text-2: #bac4b7;
    --muted: #849182;
    --accent: #82a47f;
    --accent-strong: #96b893;
    --accent-soft: rgba(130, 164, 127, 0.16);
    --warm: #df887d;
    --warm-soft: rgba(196, 98, 90, 0.18);
    --wood: #77b88d;
    --fire: #e08279;
    --earth: #d7b26d;
    --metal: #a5b0ba;
    --water: #7fb0d4;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 14px 14px 36px;
  }
  .serif { font-family: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif; }
  .wrap { max-width: 980px; margin: 0 auto; }

  .mode-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .mode-tabs {
    display: inline-flex;
    background: var(--card-soft);
    border-radius: 10px;
    padding: 3px;
    gap: 4px;
    flex-wrap: wrap;
  }
  .mode-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s;
  }
  .mode-btn.active { background: var(--accent); color: #fff; }
  .engine-tag { font-size: 12px; color: var(--muted); }

  .view-panel { display: none; }
  .view-panel.active { display: block; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    border-left: 3px solid var(--accent);
    padding-left: 9px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 600;
  }

  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .form-row label { font-size: 12px; color: var(--muted); font-weight: 600; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--card-soft);
    color: var(--text);
    font-size: 13.5px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .inline-row { display: flex; gap: 8px; align-items: center; }
  .loc-grid { display: grid; grid-template-columns: 1fr 1fr 84px; gap: 6px; }
  @media (max-width: 480px) { .loc-grid { grid-template-columns: 1fr 1fr; } .loc-grid input { grid-column: 1 / -1; } }

  .gender-toggle {
    display: inline-flex;
    background: var(--card-soft);
    border-radius: 9px;
    padding: 3px;
    gap: 3px;
    border: 1px solid var(--line);
  }
  .gender-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .gender-btn.active { background: var(--accent); color: #fff; }

  .checkbox-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .checkbox-label input { width: auto; }

  .btn {
    padding: 9px 15px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card-soft);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    padding: 12px;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-soft {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent-strong);
  }
  .btn-sm { padding: 5px 11px; font-size: 12px; }

  .el-木 { color: var(--wood); } .bg-木 { background: var(--wood); }
  .el-火 { color: var(--fire); } .bg-火 { background: var(--fire); }
  .el-土 { color: var(--earth); } .bg-土 { background: var(--earth); }
  .el-金 { color: var(--metal); } .bg-金 { background: var(--metal); }
  .el-水 { color: var(--water); } .bg-水 { background: var(--water); }

  .score-hero {
    text-align: center;
    padding: 18px 12px;
    background: var(--card-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 14px;
  }
  .score-label { font-size: 13px; color: var(--muted); }
  .score-result-value {
    font-size: 40px;
    font-weight: 800;
    color: var(--accent-strong);
    line-height: 1.15;
    margin: 4px 0;
  }
  .score-range { font-size: 12.5px; color: var(--warm); font-weight: 600; margin-top: 2px; }
  .score-verdict { font-size: 14px; color: var(--text); margin-top: 6px; font-weight: 600; }

  .pillars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 8px 0 10px;
  }
  .pillar-box {
    background: var(--card-soft);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 9px 4px;
    text-align: center;
  }
  .pillar-label { font-size: 11px; color: var(--muted); }
  .pillar-gz { font-size: 20px; font-weight: 700; margin: 3px 0; letter-spacing: 2px; }
  .pillar-sub { font-size: 11px; color: var(--muted); }

  .wx-bars { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .wx-bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .wx-track { flex: 1; height: 7px; background: var(--line-soft); border-radius: 99px; overflow: hidden; }
  .wx-fill { height: 100%; border-radius: 99px; }

  .result-split {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    gap: 16px;
    align-items: center;
    margin-top: 12px;
  }
  @media (max-width: 720px) { .result-split { grid-template-columns: 1fr; } }
  .radar-wrap { display: flex; justify-content: center; }

  .dim-item { border-top: 1px dashed var(--line); padding: 9px 0; }
  .dim-item:first-child { border-top: none; padding-top: 0; }
  .dim-head { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 700; }
  .dim-score { color: var(--accent-strong); }
  .dim-desc { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }

  .ceil-card {
    background: var(--card-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ceil-score {
    font-size: 32px;
    font-weight: 800;
    color: var(--accent-strong);
    line-height: 1.1;
  }
  .ceil-meta { font-size: 12.5px; color: var(--text-2); line-height: 1.6; }
  .ceil-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    margin-bottom: 8px;
    background: var(--card-soft);
    cursor: pointer;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .del-btn { border: none; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 4px 8px; }
  .del-btn:hover { color: var(--warm); }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="mode-bar">
    <div class="mode-tabs" role="tablist">
      <button type="button" class="mode-btn active" id="modeLove" onclick="switchView('love')">♡ 婚恋合盘</button>
      <button type="button" class="mode-btn" id="modeFriend" onclick="switchView('friend')">✦ 友情 / 人际</button>
      <button type="button" class="mode-btn" id="modeCeiling" onclick="switchView('ceiling')">★ 测算个人理论上限</button>
    </div>
    <span class="engine-tag">V5.4 · 乾坤造区分 · 理论上限穷举引擎</span>
  </div>

  <!-- ==================== 视图 1：双人合盘 ==================== -->
  <div id="viewSynastry" class="view-panel active">
    <div class="grid-2">
      <!-- 甲方 -->
      <div class="card">
        <div class="card-title">
          <span>甲方出生信息</span>
          <div class="gender-toggle">
            <button type="button" class="gender-btn active" id="gA_M" onclick="setGender('A','M')">男 · 乾造</button>
            <button type="button" class="gender-btn" id="gA_F" onclick="setGender('A','F')">女 · 坤造</button>
          </div>
        </div>
        <div class="form-row">
          <label>称呼</label>
          <input id="nameA" type="text" value="我（丙戌 己亥 甲辰）" placeholder="输入称呼">
        </div>
        <div class="form-row">
          <label>公历出生日期</label>
          <input id="dateA" type="date" value="2006-11-11">
        </div>
        <div class="form-row">
          <label>出生时间（北京时间 UTC+8）</label>
          <div class="inline-row">
            <input id="timeA" type="time" value="12:00">
            <label class="checkbox-label"><input id="unkA" type="checkbox" onchange="toggleTime('A')">未知时辰</label>
          </div>
        </div>
        <div class="form-row">
          <label>出生地（省 / 市联动自动匹配经度，右侧可手动微调）</label>
          <div class="loc-grid">
            <select id="provA" onchange="onProvChange('A')"></select>
            <select id="cityA" onchange="onCityChange('A')"></select>
            <input id="lonA" type="number" step="0.01" value="118.78" title="东经度数">
          </div>
        </div>
      </div>

      <!-- 乙方 -->
      <div class="card">
        <div class="card-title">
          <span>乙方出生信息</span>
          <div class="gender-toggle">
            <button type="button" class="gender-btn" id="gB_M" onclick="setGender('B','M')">男 · 乾造</button>
            <button type="button" class="gender-btn active" id="gB_F" onclick="setGender('B','F')">女 · 坤造</button>
          </div>
        </div>
        <div class="form-row">
          <label>称呼</label>
          <input id="nameB" type="text" value="乙方" placeholder="输入称呼">
        </div>
        <div class="form-row">
          <label>公历出生日期</label>
          <input id="dateB" type="date" value="2005-03-26">
        </div>
        <div class="form-row">
          <label>出生时间（北京时间 UTC+8）</label>
          <div class="inline-row">
            <input id="timeB" type="time" value="08:00">
            <label class="checkbox-label"><input id="unkB" type="checkbox" onchange="toggleTime('B')">未知时辰</label>
          </div>
        </div>
        <div class="form-row">
          <label>出生地（省 / 市联动自动匹配经度，右侧可手动微调）</label>
          <div class="loc-grid">
            <select id="provB" onchange="onProvChange('B')"></select>
            <select id="cityB" onchange="onCityChange('B')"></select>
            <input id="lonB" type="number" step="0.01" value="120.00" title="东经度数">
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="padding: 12px;">
      <button type="button" class="btn btn-primary" onclick="runSynastry()">开始真太阳时排盘与五维合盘</button>
    </div>

    <div id="synastryResult"></div>

    <div class="card">
      <div class="card-title">
        <span>本地合盘历史记录</span>
        <button type="button" class="btn btn-sm" onclick="clearHistory()">清空</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- ==================== 视图 2：测算任意人的理论爱情 & 友情上限 ==================== -->
  <div id="viewCeiling" class="view-panel">
    <div class="card">
      <div class="card-title">
        <span>测算任意人的理论爱情 / 友情上限</span>
        <div class="gender-toggle">
          <button type="button" class="gender-btn active" id="gC_M" onclick="setGender('C','M')">男 · 乾造</button>
          <button type="button" class="gender-btn" id="gC_F" onclick="setGender('C','F')">女 · 坤造</button>
        </div>
      </div>
      <p class="hint" style="margin-bottom:12px;">
        输入任意人的出生信息，系统将在指定年龄段内实时穷举所有高契合度真实公历日期与时辰，算出此人在 V5.4 算法下的<b>理论爱情上限</b>与<b>理论友情上限</b>，并给出具体可复现的最佳匹配八字与出生时间。
      </p>
      <div class="grid-2">
        <div class="form-row">
          <label>称呼</label>
          <input id="nameC" type="text" value="我（丙戌 己亥 甲辰）" placeholder="输入姓名或称呼">
        </div>
        <div class="form-row">
          <label>公历出生日期</label>
          <input id="dateC" type="date" value="2006-11-11">
        </div>
        <div class="form-row">
          <label>出生时间（北京时间 UTC+8）</label>
          <div class="inline-row">
            <input id="timeC" type="time" value="12:00">
            <label class="checkbox-label"><input id="unkC" type="checkbox" onchange="toggleTime('C')">未知时辰(按午时估算)</label>
          </div>
        </div>
        <div class="form-row">
          <label>匹配搜索年龄段</label>
          <select id="spanC">
            <option value="5" selected>同龄段（出生前后 ±5 岁）</option>
            <option value="10">较宽范围（出生前后 ±10 岁）</option>
            <option value="15">大跨度（出生前后 ±15 岁）</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>出生地（省 / 市联动自动匹配经度）</label>
        <div class="loc-grid">
          <select id="provC" onchange="onProvChange('C')"></select>
          <select id="cityC" onchange="onCityChange('C')"></select>
          <input id="lonC" type="number" step="0.01" value="118.78" title="东经度数">
        </div>
      </div>
      <div class="inline-row" style="margin-top:12px;flex-wrap:wrap;">
        <button type="button" class="btn btn-primary" style="flex:1;min-width:220px;" onclick="runCeilingFinder()">★ 一键测算理论爱情 & 友情上限</button>
        <button type="button" class="btn btn-soft" onclick="copyFromAtoC()">从甲方同步信息</button>
      </div>
    </div>

    <div id="ceilingResult"></div>
  </div>
</div>

<script>
/* ================= 与父页面同步深浅护眼主题 ================= */
function syncParentTheme() {
  try {
    const t = window.parent?.document?.documentElement?.getAttribute('data-theme');
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
  } catch (_) {}
}
syncParentTheme();
try {
  new MutationObserver(syncParentTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch (_) {}

/* ================= 历法与五行核心 ================= */
const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const STEM_EL = ['木','木','火','火','土','土','金','金','水','水'];
const BRANCH_EL = ['水','土','木','木','土','火','火','土','金','金','土','水'];
const ELEMENTS = ['木','火','土','金','水'];
const HIDDEN_STEMS = [
  [[9,1.0]], [[5,0.6],[9,0.25],[7,0.15]], [[0,0.6],[2,0.25],[4,0.15]], [[1,1.0]],
  [[4,0.6],[1,0.25],[9,0.15]], [[2,0.6],[6,0.25],[4,0.15]], [[3,0.7],[5,0.3]], [[5,0.6],[3,0.25],[1,0.15]],
  [[6,0.6],[8,0.25],[4,0.15]], [[7,1.0]], [[4,0.6],[7,0.25],[3,0.15]], [[8,0.7],[0,0.3]]
];

function toJulianDay(y, m, d, hUTC) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + hUTC / 24 + B - 1524.5;
}
function getSunLongitude(jd) {
  const T = (jd - 2451545.0) / 36525.0;
  let L0 = (280.46646 + 36000.76983 * T + 0.0003032 * T * T) % 360; if (L0 < 0) L0 += 360;
  let M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) % 360; if (M < 0) M += 360;
  const Mrad = M * Math.PI / 180;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad) + (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad) + 0.000289 * Math.sin(3 * Mrad);
  const omega = (125.04 - 1934.136 * T) * Math.PI / 180;
  let lam = (L0 + C - 0.00569 - 0.00478 * Math.sin(omega)) % 360;
  return lam < 0 ? lam + 360 : lam;
}
function getTrueSolarOffsetMin(y, m, d, lon) {
  const doy = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 0)) / 86400000);
  const B = 2 * Math.PI * (doy - 81) / 365;
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  return (lon - 120) * 4 + eot;
}
function getTenGod(meStem, targetStem) {
  const meEl = Math.floor(meStem / 2), tEl = Math.floor(targetStem / 2);
  const samePol = (meStem % 2) === (targetStem % 2);
  const diff = (tEl - meEl + 5) % 5;
  return [['比肩','劫财'],['食神','伤官'],['偏财','正财'],['七杀','正官'],['偏印','正印']][diff][samePol ? 0 : 1];
}
function getSpouseElement(dStem, gender) {
  return ELEMENTS[(Math.floor(dStem / 2) + (gender === 'M' ? 2 : 3)) % 5];
}

function calcBazi(year, month, day, hour, minute, lon = 120, gender = 'M', fixedHourBranch = null) {
  const offsetMin = getTrueSolarOffsetMin(year, month, day, lon);
  const tst = new Date(Date.UTC(year, month - 1, day, hour, minute) + Math.round(offsetMin * 60000));
  const ty = tst.getUTCFullYear(), tm = tst.getUTCMonth() + 1, td = tst.getUTCDate(), th = tst.getUTCHours(), tmin = tst.getUTCMinutes();
  const jd = toJulianDay(year, month, day, (hour + minute / 60) - 8);
  const sunLon = getSunLongitude(jd);

  let baziYear = year;
  if (month <= 2 && sunLon < 315 && sunLon > 260) baziYear = year - 1;
  if (month === 12 && sunLon >= 315) baziYear = year + 1;
  const yStem = ((baziYear - 4) % 10 + 10) % 10;
  const yBranch = ((baziYear - 4) % 12 + 12) % 12;

  const monthIdx = Math.floor(((sunLon - 315 + 360) % 360) / 30);
  const mBranch = (monthIdx + 2) % 12;
  const mStem = ((yStem % 5) * 2 + 2 + monthIdx) % 10;

  const dayShift = (fixedHourBranch === null && th >= 23) ? 1 : 0;
  const daysSince2000 = Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(2000, 0, 1)) / 86400000) + dayShift;
  const dIdx = ((54 + daysSince2000) % 60 + 60) % 60;
  const dStem = dIdx % 10, dBranch = dIdx % 12;

  const hBranch = fixedHourBranch !== null ? fixedHourBranch : Math.floor(((th + 1) % 24) / 2);
  const hStem = ((dStem % 5) * 2 + hBranch) % 10;

  const isYangYear = (yStem % 2) === 0;
  const dayunDir = ((isYangYear && gender === 'M') || (!isYangYear && gender === 'F')) ? '顺行大运' : '逆行大运';

  const scores = { '木':0, '火':0, '土':0, '金':0, '水':0 };
  [yStem, mStem, dStem, hStem].forEach(s => { scores[STEM_EL[s]] += 1.0; });
  [yBranch, mBranch, dBranch, hBranch].forEach((b, idx) => {
    const wMul = [1.0, 1.8, 1.2, 1.0][idx];
    HIDDEN_STEMS[b].forEach(([hs, w]) => { scores[STEM_EL[hs]] += w * wMul; });
  });
  const total = Object.values(scores).reduce((a, b) => a + b, 0);
  const pct = {};
  ELEMENTS.forEach(e => pct[e] = +(scores[e] / total * 100).toFixed(1));

  const spouseEl = getSpouseElement(dStem, gender);
  const pillars = [
    { label:'年柱', s:yStem, b:yBranch, tg:getTenGod(dStem, yStem) },
    { label:'月柱', s:mStem, b:mBranch, tg:getTenGod(dStem, mStem) },
    { label:'日柱', s:dStem, b:dBranch, tg:gender === 'M' ? '元男' : '元女' },
    { label:'时柱', s:hStem, b:hBranch, tg:getTenGod(dStem, hStem) }
  ];
  return {
    gender, dayunDir, spouseEl, pillars,
    gz: pillars.map(p => STEMS[p.s] + BRANCHES[p.b]).join(' '),
    yStem, yBranch, mStem, mBranch, dStem, dBranch, hStem, hBranch,
    pct,
    tstStr: `${String(th).padStart(2,'0')}:${String(tmin).padStart(2,'0')}`,
    offsetMin: Math.round(offsetMin)
  };
}

/* ================= 五维合盘评分引擎 ================= */
const STEM_COMBINE = [[0,5],[1,6],[2,7],[3,8],[4,9]];
const BRANCH_SIX_COMBINE = [[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
const BRANCH_CLASH = [[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];

const BRANCH_TRINE = [[8,0,4],[11,3,7],[2,6,10],[5,9,1]];

const hasPair = (list, a, b) => list.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
const sameTrine = (a, b) => a !== b && BRANCH_TRINE.some(g => g.includes(a) && g.includes(b));
function elRel(e1, e2) {
  const i1 = ELEMENTS.indexOf(e1), i2 = ELEMENTS.indexOf(e2);
  if (i1 === i2) return '比和';
  if ((i1 + 1) % 5 === i2 || (i2 + 1) % 5 === i1) return '相生';
  return '相克';
}

function evaluatePair(bzA, bzB, mode = 'love') {

  }

  if (hasPair(BRANCH_SIX_COMBINE, bA, bB)) { s2 = 95.0; d2 = `日支${BRANCHES[bA]}${BRANCHES[bB]}六合，生活习惯与亲密感高度贴合。`; }

    if (bzA.dayunDir === bzB.dayunDir) { hit += 3; notes.push(`双方同为${bzA.dayunDir}，大运节律同步`); }
    s3 = Math.min(96.0, +(66.0 + hit).toFixed(1));

/* ================= 个人理论上限穷举引擎 ================= */
function searchPersonalCeiling(meBz, birthYear, spanYears, targetGender, mode) {
  const yStart = Math.max(1950, birthYear - spanYears);
  const yEnd = Math.min(2030, birthYear + spanYears);
  let best = null;

  const startMs = Date.UTC(yStart, 0, 1);
  const endMs = Date.UTC(yEnd, 11, 31);
  const dayMs = 86400000;
  const base2000 = Date.UTC(2000, 0, 1);
  const hours = [0, 4, 8, 12, 16, 20];

  for (let ms = startMs; ms <= endMs; ms += dayMs) {
    const days2000 = Math.round((ms - base2000) / dayMs);
    const dIdx = ((54 + days2000) % 60 + 60) % 60;
    const dS = dIdx % 10, dB = dIdx % 12;

    // 快速剪枝：只精算日支六合/半三合 且 日干五合/相生/比和的候选日
    if (!(hasPair(BRANCH_SIX_COMBINE, meBz.dBranch, dB) || sameTrine(meBz.dBranch, dB))) continue;
    if (!(hasPair(STEM_COMBINE, meBz.dStem, dS) || ['相生', '比和'].includes(elRel(STEM_EL[meBz.dStem], STEM_EL[dS])))) continue;

    const dt = new Date(ms);
    const y = dt.getUTCFullYear(), m = dt.getUTCMonth() + 1, d = dt.getUTCDate();
    for (let hi = 0; hi < hours.length; hi++) {
      const hh = hours[hi];
      const cand = calcBazi(y, m, d, hh, 0, 120.0, targetGender);
      const ev = evaluatePair(meBz, cand, mode);
      if (!best || ev.total > best.score) {
        best = {
          score: ev.total,
          dims: ev.dims,
          date: `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
          time: `${String(hh).padStart(2,'0')}:00`,
          gender: targetGender,
          bz: cand
        };
      }
    }
  }
  return best;
}

function runCeilingFinder() {
  const name = document.getElementById('nameC').value.trim() || '测算对象';
  const dateStr = document.getElementById('dateC').value;
  const timeStr = document.getElementById('timeC').value || '12:00';
  const unk = document.getElementById('unkC').checked;
  const lon = parseFloat(document.getElementById('lonC').value) || 120;
  const span = Number(document.getElementById('spanC').value) || 5;
  if (!dateStr) return alert('请填写公历出生日期');

  const [y, m, d] = dateStr.split('-').map(Number);
  const [hh, mm] = unk ? [12, 0] : timeStr.split(':').map(Number);
  const meBz = calcBazi(y, m, d, hh, mm, lon, genderC);

  const oppGender = genderC === 'M' ? 'F' : 'M';
  const bestLove = searchPersonalCeiling(meBz, y, span, oppGender, 'love');
  const bestFriend = searchPersonalCeiling(meBz, y, span, genderC, 'friend');

  lastCeilingResult = {
    me: { name, gender: genderC, date: dateStr, time: unk ? '12:00' : timeStr, unk, lon, bz: meBz },
    love: bestLove,
    friend: bestFriend
  };

  const renderBox = (title, mode, res) => {
    if (!res) return '';
    const gTxt = res.gender === 'M' ? '乾造 · 男' : '坤造 · 女';
    return `
      <div class="ceil-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <b>${title}</b>
          <span class="badge">${gTxt}</span>
        </div>
        <div class="ceil-score serif">${res.score.toFixed(3)} <span style="font-size:14px;font-weight:500;">分</span></div>
        <div class="ceil-meta">
          <div><b>最佳匹配公历：</b>${res.date} ${res.time}</div>
          <div><b>最佳匹配八字：</b>${res.bz.gz}</div>
          <div><b>五维拆解：</b>${res.dims.map(x => `${x.name} ${x.score}`).join(' · ')}</div>
        </div>
        <div class="ceil-actions">
          <button type="button" class="btn btn-sm btn-soft" onclick="applyCeilingToSynastry('${mode}')">一键带入合盘看雷达图</button>
        </div>
      </div>`;
  };

  document.getElementById('ceilingResult').innerHTML = `
    <div class="card">
      <div class="card-title">
        <span>${name} 的理论上限报告（前后 ±${span} 岁实测）</span>
        <button type="button" class="btn btn-sm btn-soft" onclick="pinCeilingToSidebar()">★ 同步设为右侧个人理论上限</button>
      </div>
      <div style="margin-bottom:14px;">${renderPersonCard(name, meBz, unk)}</div>
      <div class="grid-2">
        ${renderBox('♡ 理论爱情上限（异性最佳）', 'love', bestLove)}
        ${renderBox('✦ 理论友情上限（同频最佳）', 'friend', bestFriend)}
      </div>
    </div>`;
}

function applyCeilingToSynastry(mode) {
  if (!lastCeilingResult) return;
  const me = lastCeilingResult.me;
  const target = mode === 'love' ? lastCeilingResult.love : lastCeilingResult.friend;
  if (!target) return;

  switchView(mode);
  setGender('A', me.gender);
  setGender('B', target.gender);
  document.getElementById('nameA').value = me.name;
  document.getElementById('dateA').value = me.date;
  document.getElementById('timeA').value = me.time;
  document.getElementById('unkA').checked = me.unk;
  document.getElementById('lonA').value = me.lon;

  document.getElementById('nameB').value = mode === 'love' ? '理论爱情满配' : '理论友情满配';
  document.getElementById('dateB').value = target.date;
  document.getElementById('timeB').value = target.time;
  document.getElementById('unkB').checked = false;
  document.getElementById('lonB').value = 120.00;

  toggleTime('A'); toggleTime('B');
  runSynastry(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pinCeilingToSidebar() {
  if (!lastCeilingResult) return;
  const me = lastCeilingResult.me;
  const makeRec = (mode, res, label) => ({
    label, mode, score: res.score,
    nameA: me.name, genderA: me.gender, dateA: me.date, timeA: me.time, unkA: me.unk, lonA: me.lon, gzA: me.bz.gz,
    nameB: mode === 'love' ? '理论爱情满配' : '理论友情满配',
    genderB: res.gender, dateB: res.date, timeB: res.time, unkB: false, lonB: 120.00, gzB: res.bz.gz,
    note: res.dims.slice(0, 3).map(d => `${d.name}${d.score}`).join(' · ')
  });
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'BAZI_V54_SAVE_CEILING',
        love: makeRec('love', lastCeilingResult.love, `${me.name} · 理论爱情上限`),
        friend: makeRec('friend', lastCeilingResult.friend, `${me.name} · 理论友情上限`)
      }, '*');
    }
  } catch (_) {}
}

/* ================= 渲染与双人合盘 ================= */
function buildRadarSVG(dims, maxDims = null) {
  const cx = 138, cy = 132, r = 90;
  const angles = dims.map((_, i) => -Math.PI / 2 + i * 2 * Math.PI / 5);
  const pt = (val, i) => `${(cx + r * (val / 100) * Math.cos(angles[i])).toFixed(1)},${(cy + r * (val / 100) * Math.sin(angles[i])).toFixed(1)}`;
  let gridSvg = '';
  [25, 50, 75, 100].forEach(lv => { gridSvg += `<polygon points="${angles.map((_, i) => pt(lv, i)).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  angles.forEach((_, i) => {
    const [x, y] = pt(100, i).split(','), [lx, ly] = pt(116, i).split(',');
    gridSvg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    gridSvg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="var(--muted)" font-weight="600">${dims[i].name}</text>`;
  });
  const rangeSvg = maxDims ? `<polygon points="${maxDims.map((v, i) => pt(v, i)).join(' ')}" fill="rgba(181,87,75,0.10)" stroke="var(--warm)" stroke-dasharray="4 3" stroke-width="1.4"/>` : '';
  return `<svg width="276" height="264" viewBox="0 0 276 264">${gridSvg}${rangeSvg}<polygon points="${dims.map((d, i) => pt(d.score, i)).join(' ')}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>${dims.map((d, i) => { const [x, y] = pt(d.score, i).split(','); return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent-strong)"/>`; }).join('')}</svg>`;
}

function renderPersonCard(name, bz, isUnk) {
  const roleTag = bz.gender === 'M' ? '乾造 · 男' : '坤造 · 女';
  const spLabel = bz.gender === 'M' ? `妻星(财)：${bz.spouseEl}` : `夫星(官杀)：${bz.spouseEl}`;
  const bars = ELEMENTS.map(e => `<div class="wx-bar-row"><span class="el-${e}" style="width:20px;font-weight:700">${e}</span><div class="wx-track"><div class="wx-fill bg-${e}" style="width:${bz.pct[e]}%"></div></div><span style="width:38px;text-align:right;color:var(--muted)">${bz.pct[e]}%</span></div>`).join('');
  return `<div>
    <div style="font-size:13px;font-weight:700;margin-bottom:4px;">
      ${name} <span class="badge">${roleTag}</span>
      <span style="font-weight:400;font-size:11px;color:var(--muted);margin-left:4px">${bz.dayunDir} · ${spLabel}</span>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">
      ${isUnk ? '时辰未知 · 仅排三柱' : `真太阳时 ${bz.tstStr}（校正 ${bz.offsetMin >= 0 ? '+' : ''}${bz.offsetMin} 分）`}
    </div>
    <div class="pillars">${bz.pillars.map((p, idx) => `
      <div class="pillar-box">
        <div class="pillar-label">${p.label} · ${idx === 3 && isUnk ? '?' : p.tg}</div>
        <div class="pillar-gz serif">${idx === 3 && isUnk ? '<span style="color:var(--muted)">??</span>' : `<span class="el-${STEM_EL[p.s]}">${STEMS[p.s]}</span><span class="el-${BRANCH_EL[p.b]}">${BRANCHES[p.b]}</span>`}</div>
        <div class="pillar-sub">${idx === 3 && isUnk ? '遍历12时' : STEM_EL[p.s] + BRANCH_EL[p.b]}</div>
      </div>`).join('')}
    </div>
    <div class="wx-bars">${bars}</div>
  </div>`;
}

function runSynastry(save = true) {
  const nameA = document.getElementById('nameA').value.trim() || '甲方';
  const nameB = document.getElementById('nameB').value.trim() || '乙方';
  const dateA = document.getElementById('dateA').value, dateB = document.getElementById('dateB').value;
  const timeA = document.getElementById('timeA').value || '12:00', timeB = document.getElementById('timeB').value || '12:00';
  const unkA = document.getElementById('unkA').checked, unkB = document.getElementById('unkB').checked;
  const lonA = parseFloat(document.getElementById('lonA').value) || 120, lonB = parseFloat(document.getElementById('lonB').value) || 120;
  if (!dateA || !dateB) return alert('请完整填写双方出生日期');

  const [yA, mA, dA] = dateA.split('-').map(Number), [hA, minA] = timeA.split(':').map(Number);
  const [yB, mB, dB] = dateB.split('-').map(Number), [hB, minB] = timeB.split(':').map(Number);
  const baseA = calcBazi(yA, mA, dA, hA, minA, lonA, genderA);
  const baseB = calcBazi(yB, mB, dB, hB, minB, lonB, genderB);

  let evalRes, minScore, maxScore, maxDimArr = null;
  if (!unkA && !unkB) {
    evalRes = evaluatePair(baseA, baseB, currentMode);
    minScore = maxScore = evalRes.total;
  } else {
    const hoursA = unkA ? [...Array(12).keys()] : [null], hoursB = unkB ? [...Array(12).keys()] : [null];
    let sumTotal = 0, count = 0; minScore = 100; maxScore = 0;
    const dimSums = [0,0,0,0,0], minDimArr = [100,100,100,100,100]; maxDimArr = [0,0,0,0,0];
    let sampleRes = null;
    hoursA.forEach(hbA => {
      const bzA = hbA === null ? baseA : calcBazi(yA, mA, dA, 12, 0, lonA, genderA, hbA);
      hoursB.forEach(hbB => {
        const bzB = hbB === null ? baseB : calcBazi(yB, mB, dB, 12, 0, lonB, genderB, hbB);
        const r = evaluatePair(bzA, bzB, currentMode);
        if (!sampleRes) sampleRes = r;
        sumTotal += r.total; count++;
        if (r.total < minScore) minScore = r.total;
        if (r.total > maxScore) maxScore = r.total;
        r.dims.forEach((dm, idx) => { dimSums[idx] += dm.score; if (dm.score > maxDimArr[idx]) maxDimArr[idx] = dm.score; if (dm.score < minDimArr[idx]) minDimArr[idx] = dm.score; });
      });
    });
    evalRes = {
      total: +(sumTotal / count).toFixed(3),
      dims: sampleRes.dims.map((dm, idx) => ({
        name: dm.name,
        score: +(dimSums[idx] / count).toFixed(1),
        desc: dm.desc + (maxDimArr[idx] !== minDimArr[idx] ? `（时辰波动 ${minDimArr[idx].toFixed(1)}–${maxDimArr[idx].toFixed(1)} 分）` : '')
      }))
    };
  }

  const verdict = evalRes.total >= 85 ? '深度共鸣 · 气场极度契合' : evalRes.total >= 76 ? '良缘可期 · 互补大于摩擦' : evalRes.total >= 67 ? '平实相守 · 重在沟通磨合' : '张力较强 · 需留足边界感';
  document.getElementById('synastryResult').innerHTML = `
    <div class="card">
      <div class="score-hero">
        <div class="score-label">${nameA}（${genderA === 'M' ? '乾造' : '坤造'}）× ${nameB}（${genderB === 'M' ? '乾造' : '坤造'}） · ${currentMode === 'love' ? '婚恋模式' : '友情模式'}</div>
        <div class="score-result-value serif" id="totalScoreResult">综合得分：${evalRes.total.toFixed(3)}</div>
        ${(unkA || unkB) ? `<div class="score-range">未知时辰穷举区间：${minScore.toFixed(3)} – ${maxScore.toFixed(3)} 分（虚线为上限）</div>` : ''}
        <div class="score-verdict">${verdict}</div>
      </div>
      <div class="grid-2" style="margin-bottom:14px;">
        ${renderPersonCard(nameA, baseA, unkA)}
        ${renderPersonCard(nameB, baseB, unkB)}
      </div>
      <div class="result-split">
        <div class="radar-wrap">${buildRadarSVG(evalRes.dims, maxDimArr)}</div>
        <div>${evalRes.dims.map(d => `<div class="dim-item"><div class="dim-head"><span>${d.name}</span><span class="dim-score">${d.score} 分</span></div><div class="dim-desc">${d.desc}</div></div>`).join('')}</div>
      </div>
    </div>`;

  const gzA = baseA.pillars.map((p, idx) => idx === 3 && unkA ? '??' : (STEMS[p.s] + BRANCHES[p.b])).join(' ');
  const gzB = baseB.pillars.map((p, idx) => idx === 3 && unkB ? '??' : (STEMS[p.s] + BRANCHES[p.b])).join(' ');
  const payload = {
    mode: currentMode, genderA, genderB,
    nameA, dateA, timeA, unkA, lonA,
    nameB, dateB, timeB, unkB, lonB,
    gzA, gzB,
    score: evalRes.total,
    scoreText: evalRes.total.toFixed(3),
    range: (unkA || unkB) ? `${minScore.toFixed(3)}–${maxScore.toFixed(3)}` : null
  };

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'BAZI_V53_RESULT', payload, isUserRun: !!save }, '*');
    }
  } catch (_) {}

  if (save) {
    saveHistory({
      id: Date.now(), ...payload,
      score: evalRes.total.toFixed(3),
      range: (unkA || unkB) ? `${minScore.toFixed(1)}-${maxScore.toFixed(1)}` : null,
      createdAt: new Date().toLocaleString('zh-CN', { hour12: false })
    });
  }
}

window.addEventListener('message', e => {
  const msg = e.data;

const STORE_KEY = 'suiwind_bazi_v52_history';
const getHistory = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch { return []; } };
function saveHistory(item) { const list = getHistory(); list.unshift(item); localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(0, 30))); renderHistory(); }
function deleteHistory(id, e) { e.stopPropagation(); localStorage.setItem(STORE_KEY, JSON.stringify(getHistory().filter(x => x.id !== id))); renderHistory(); }
function clearHistory() { localStorage.removeItem(STORE_KEY); renderHistory(); }
function loadHistoryById(id) {
  const item = getHistory().find(x => x.id === id); if (!item) return;
  switchView(item.mode === 'friend' ? 'friend' : 'love');
  if (item.genderA) setGender('A', item.genderA);
  if (item.genderB) setGender('B', item.genderB);
  document.getElementById('nameA').value = item.nameA; document.getElementById('dateA').value = item.dateA;
  document.getElementById('timeA').value = item.timeA; document.getElementById('unkA').checked = item.unkA;
  document.getElementById('lonA').value = item.lonA;
  document.getElementById('nameB').value = item.nameB; document.getElementById('dateB').value = item.dateB;
  document.getElementById('timeB').value = item.timeB; document.getElementById('unkB').checked = item.unkB;
  document.getElementById('lonB').value = item.lonB;
  toggleTime('A'); toggleTime('B'); runSynastry(false);
}
function renderHistory() {
  const list = getHistory(), el = document.getElementById('historyList');
  if (!list.length) { el.innerHTML = '<p class="hint">暂无合盘记录，点击上方按钮测算后自动保存在本地。</p>'; return; }
  el.innerHTML = list.map(item => `
    <div class="history-item" onclick="loadHistoryById(${item.id})">
      <div>
        <div style="font-size:13.5px;font-weight:700">
          ${item.nameA}(${item.genderA === 'F' ? '女' : '男'}) × ${item.nameB}(${item.genderB === 'M' ? '男' : '女'})
          <span class="badge" style="margin-left:6px">${item.mode === 'friend' ? '友情' : '婚恋'} · ${item.score}分${item.range ? ` (${item.range})` : ''}</span>
        </div>
        <div class="history-meta">${item.dateA} / ${item.dateB} · ${item.createdAt}</div>
      </div>
      <button type="button" class="del-btn" onclick="deleteHistory(${item.id}, event)">删除</button>
    </div>`).join('');
}
